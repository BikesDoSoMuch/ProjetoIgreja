{% extends "base.html" %}
{% block content %}
  <h1>Confirmar exclusão</h1>
  <p>Tem certeza que deseja excluir "{{ object }}"?</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger" type="submit">Sim, excluir</button>
    <a class="btn btn-secondary" href="{% url 'familia_list' %}">Cancelar</a>
  </form>
{% endblock %}
